<div class="container py-4">
  <h4 class="section-title">Find a place to play</h4>
  <p class="section-sub">Search by venue name, area or sport and use the filters below.</p>

  <!-- Search + filters -->
  <div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-lg-4">
          <input type="text" class="form-control" id="searchInput" placeholder="Search venue, area or sport...">
        </div>
        <div class="col-6 col-lg-2">
          <select class="form-select" id="filterSport">
            <option value="">All Sports</option>
            <option>Cricket</option>
            <option>Football</option>
            <option>Badminton</option>
            <option>Basketball</option>
            <option>Tennis</option>
            <option>Volleyball</option>
          </select>
        </div>
        <div class="col-6 col-lg-2">
          <select class="form-select" id="filterLocation">
            <option value="">All Locations</option>
          </select>
        </div>
        <div class="col-6 col-lg-2">
          <select class="form-select" id="filterPrice">
            <option value="">Any Price</option>
            <option value="low">Below &#8377;500</option>
            <option value="mid">&#8377;500 - &#8377;800</option>
            <option value="high">Above &#8377;800</option>
          </select>
        </div>
        <div class="col-6 col-lg-2">
          <select class="form-select" id="filterRating">
            <option value="">Any Rating</option>
            <option value="4">4.0 &amp; above</option>
            <option value="4.5">4.5 &amp; above</option>
          </select>
        </div>
      </div>

      <div class="row g-2 mt-1 align-items-center">
        <div class="col-md-4">
          <select class="form-select" id="sortBy">
            <option value="">Sort by</option>
            <option value="priceLow">Price: Low to High</option>
            <option value="priceHigh">Price: High to Low</option>
            <option value="rating">Rating</option>
          </select>
        </div>
        <div class="col-md-4">
          <button class="btn btn-outline-secondary" onclick="resetFilters()">Reset Filters</button>
        </div>
        <div class="col-md-4 text-md-end">
          <span class="venue-meta" id="resultCount"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4" id="venueList"></div>
</div>
