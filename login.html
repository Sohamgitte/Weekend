<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | WEEKEND</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-weekend">
  <div class="container">
    <a class="navbar-brand" href="home.html">WEEK<span>END</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="venues.html">Venues</a></li>
        <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <div id="authArea"></div>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row g-4 justify-content-center">
    <div class="col-md-6 col-lg-5 text-start">
      <div class="auth-card h-100">
        <h4 class="fw-bold mb-4 text-center" style="color: var(--navy-dark);">Login</h4>
        <div class="alert d-none" id="loginMsg"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="liEmail">
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="liPassword">
          </div>
          <button class="btn btn-green w-100" type="submit">Login to Account</button>
        </form>
      </div>
    </div>

    <div class="col-md-6 col-lg-5 text-start">
      <div class="auth-card h-100">
        <h4 class="fw-bold mb-4 text-center" style="color: var(--navy-dark);">Sign Up</h4>
        <div class="alert d-none" id="signupMsg"></div>
        <form id="signupForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="suName">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="suEmail">
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" id="suMobile" maxlength="10">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="suPassword">
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="suConfirm">
          </div>
          <button class="btn btn-navy w-100" type="submit">Create Account</button>
        </form>
      </div>
    </div>

    <div class="col-lg-10 text-center mt-5">
      <p class="venue-meta mb-0"><i class="bi bi-shield-check me-1"></i> Sign in to manage your bookings and player details.</p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container text-center">
    <p class="mb-1">WEEKEND &mdash; Sports Venue Booking Platform</p>
    <div class="footer-note">&copy; 2026 WEEKEND Sports. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
