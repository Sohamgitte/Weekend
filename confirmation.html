<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Confirmed | WEEKEND</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-weekend no-print">
  <div class="container">
    <a class="navbar-brand" href="home.html">WEEK<span>END</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="venues.html">Venues</a></li>
        <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
      <div id="authArea"></div>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body text-center p-4" id="confirmBox"></div>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container text-center">
    <p class="mb-1">WEEKEND &mdash; Sports Venue Booking Platform</p>
    <div class="footer-note">&copy; 2026 WEEKEND Sports. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  // Show the last booking stored during payment
  document.addEventListener("DOMContentLoaded", function () {
    const b = loadData("weekend_last_booking");
    const box = document.getElementById("confirmBox");

    if (!b) {
      box.innerHTML = '<p class="mb-0">No recent booking found. <a href="venues.html">Book a venue</a>.</p>';
      return;
    }

    box.innerHTML =
      '<div class="tick-circle mb-3"><i class="bi bi-check-lg"></i></div>' +
      '<h4 style="color:#12304f">Booking Confirmed</h4>' +
      '<p class="text-muted">Your sports venue has been booked successfully.</p>' +
      '<table class="table table-sm text-start mt-4">' +
      "<tr><th>Booking ID</th><td>" + b.bookingId + "</td></tr>" +
      "<tr><th>Venue</th><td>" + b.venue + " (" + b.location + ")</td></tr>" +
      "<tr><th>Sport</th><td>" + b.sport + "</td></tr>" +
      "<tr><th>Date</th><td>" + b.date + "</td></tr>" +
      "<tr><th>Time</th><td>" + b.time + "</td></tr>" +
      "<tr><th>Duration</th><td>" + b.duration + " Hour(s)</td></tr>" +
      "<tr><th>Amount</th><td>\u20B9" + b.amount + "</td></tr>" +
      "<tr><th>Payment</th><td>" + b.paymentMethod + " - " + b.paymentStatus + "</td></tr>" +
      "</table>" +
      '<div class="no-print mt-3">' +
      '<a href="my-bookings.html" class="btn btn-green me-2">View My Bookings</a>' +
      '<a href="home.html" class="btn btn-outline-secondary me-2">Back to Home</a>' +
      '<button class="btn btn-outline-secondary" onclick="window.print()">Print Receipt</button>' +
      "</div>";
  });
</script>
</body>
</html>
